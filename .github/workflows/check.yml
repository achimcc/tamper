# One job, one command. `nix flake check` runs the tests, clippy and rustfmt
# with the same toolchain as the dev shell, so CI and a local check cannot
# drift apart.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --print-build-logs
