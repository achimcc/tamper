[package]
name = "tamper"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Mutation-test your build-time assertions: break the input on purpose and check that the check goes red"
repository = "https://github.com/achimcc/tamper"
readme = "README.md"
keywords = ["nix", "nixos", "mutation-testing", "cli"]
categories = ["command-line-utilities"]

[dependencies]
lexopt = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[lints.rust]
# `unsafe` is denied crate-wide. The five places that need it — the
# declarations of and the calls to libc's signal, _exit and kill — carry an
# `#[allow(unsafe_code)]` and a `// SAFETY:` comment each; anything new
# fails the build.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = true
